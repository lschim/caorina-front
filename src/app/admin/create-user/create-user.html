<div style="display: flex; justify-content: center; padding: 40px 16px">
  <div style="width: 100%; max-width: 400px; display: flex; flex-direction: column; gap: 16px">
    <div style="display: flex; align-items: center; gap: 16px">
      <a mat-button routerLink="/drugs">← Retour</a>
      <h2 style="margin: 0">Créer un utilisateur</h2>
    </div>

    <form
      [formGroup]="form"
      (ngSubmit)="onSubmit()"
      style="display: flex; flex-direction: column; gap: 12px"
    >
      <mat-form-field>
        <mat-label>Email</mat-label>
        <input matInput type="email" formControlName="email" autocomplete="off" />
      </mat-form-field>

      <mat-form-field>
        <mat-label>Mot de passe</mat-label>
        <input matInput type="password" formControlName="password" autocomplete="new-password" />
      </mat-form-field>

      <mat-form-field>
        <mat-label>Rôle</mat-label>
        <mat-select formControlName="role">
          <mat-option value="USER">Élève</mat-option>
          <mat-option value="ADMIN">Admin</mat-option>
        </mat-select>
      </mat-form-field>

      @if (error()) {
        <p style="color: red; margin: 0">{{ error() }}</p>
      }
      @if (success()) {
        <p style="color: green; margin: 0">{{ success() }}</p>
      }

      <button mat-raised-button color="primary" type="submit" [disabled]="loading()">
        {{ loading() ? 'Création...' : 'Créer' }}
      </button>
    </form>
  </div>
</div>
